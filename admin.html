<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DE Mastery - Admin Dashboard</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;
      
      --accent-teal: #0d9488;
      --accent-teal-dark: #0f766e;
      --accent-teal-light: #f0fdfa;
      
      --border-color: #e2e8f0;
      
      --danger: #ef4444;
      --danger-dark: #dc2626;
      --warning: #f59e0b;
      --success: #10b981;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
    }

    /* Auth Overlay */
    #auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(248, 250, 252, 0.95);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }

    .auth-logo {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .auth-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .auth-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent-teal);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      gap: 8px;
    }

    .btn-primary {
      background-color: var(--accent-teal);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--accent-teal-dark);
    }

    .btn-danger {
      background-color: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      background-color: var(--danger-dark);
    }

    /* Main Layout */
    .admin-container {
      display: none; /* Revealed after PIN validation */
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .header-logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-logo {
      font-size: 24px;
    }

    .header-title-wrapper h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .header-title-wrapper p {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Main Body Area */
    .main-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left Sidebar: Users Directory */
    .users-sidebar {
      width: 380px;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-search-box {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-list-container {
      flex: 1;
      overflow-y: auto;
    }

    .user-list-item {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .user-list-item:hover {
      background-color: var(--bg-primary);
    }

    .user-list-item.active {
      background-color: var(--accent-teal-light);
      border-left: 4px solid var(--accent-teal);
    }

    .user-meta-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .user-name {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-primary);
    }

    .user-email {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .user-stats-row {
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .user-progress-bar-wrapper {
      width: 100%;
      height: 6px;
      background-color: var(--border-color);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 6px;
    }

    .user-progress-bar-fill {
      height: 100%;
      background-color: var(--accent-teal);
      border-radius: 3px;
    }

    /* Right Main Panel: User Details */
    .details-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: var(--bg-primary);
    }

    .no-selection {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--text-tertiary);
      gap: 16px;
    }

    .no-selection-icon {
      font-size: 64px;
    }

    .details-header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 24px 32px;
      flex-shrink: 0;
    }

    .details-user-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .details-user-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* Tabs Bar */
    .details-tabs {
      display: flex;
      gap: 24px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-card);
      padding: 0 32px;
      flex-shrink: 0;
    }

    .tab-btn {
      padding: 14px 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      border: none;
      background: none;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--text-primary);
    }

    .tab-btn.active {
      color: var(--accent-teal);
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background-color: var(--accent-teal);
      border-radius: 1.5px;
    }

    /* Tabs Content Container */
    .tab-contents {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
    }

    .tab-pane {
      display: none;
      flex-direction: column;
      gap: 24px;
    }

    .tab-pane.active {
      display: flex;
    }

    /* Overview KPIs Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .kpi-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .kpi-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-primary);
    }

    /* Calendar Day Grid */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(14, 1fr);
      gap: 8px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }

    @media (max-width: 1200px) {
      .calendar-grid {
        grid-template-columns: repeat(7, 1fr);
      }
    }

    .calendar-cell {
      aspect-ratio: 1;
      border-radius: 6px;
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      color: var(--text-secondary);
    }

    .calendar-cell:hover {
      transform: scale(1.1);
      z-index: 10;
      box-shadow: var(--shadow-md);
    }

    .calendar-cell.completed {
      background-color: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .calendar-cell.penalized {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .calendar-cell.in-progress {
      background-color: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }

    /* Day Inspector Dialog */
    .day-inspect-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }

    .inspect-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .inspect-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .inspect-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .inspect-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .inspect-value {
      font-size: 14px;
      color: var(--text-primary);
    }

    /* Code Questions Split Panel */
    .workspace-split {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      height: 580px;
    }

    .workspace-list {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow-y: auto;
      padding: 12px;
    }

    .q-list-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .q-list-item:hover {
      background-color: var(--bg-primary);
    }

    .q-list-item.active {
      background-color: var(--accent-teal-light);
      color: var(--accent-teal-dark);
      font-weight: 600;
    }

    .workspace-viewer {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .workspace-viewer-header {
      background-color: var(--bg-primary);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .workspace-viewer-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .code-editor-mock {
      background-color: #0f172a;
      border-radius: 8px;
      padding: 16px;
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      color: #e2e8f0;
      white-space: pre-wrap;
      overflow-x: auto;
      max-height: 280px;
      border: 1px solid #1e293b;
    }

    /* AI Coach Chat Logs */
    .chat-log-box {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      background-color: #fafafa;
    }

    .chat-bubble {
      margin-bottom: 12px;
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
    }

    .chat-bubble.user {
      background-color: var(--accent-teal-light);
      color: var(--accent-teal-dark);
      margin-left: auto;
      border-bottom-right-radius: 2px;
    }

    .chat-bubble.coach {
      background-color: #f1f5f9;
      color: var(--text-primary);
      margin-right: auto;
      border-bottom-left-radius: 2px;
    }

    /* Utility Helpers */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      border-radius: 4px;
    }

    .badge-success { background-color: #d1fae5; color: #065f46; }
    .badge-gray { background-color: #e2e8f0; color: #475569; }
    .badge-danger { background-color: #fee2e2; color: #991b1b; }

    /* Cheat Sheet Panel */
    .cs-content-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      white-space: pre-wrap;
      max-height: 480px;
      overflow-y: auto;
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>

  <!-- Auth overlay -->
  <div id="auth-overlay">
    <div class="auth-card">
      <div class="auth-logo">🔑</div>
      <h2 class="auth-title">Admin Dashboard</h2>
      <p class="auth-subtitle">Verify security credentials to access stats</p>
      
      <div class="form-group">
        <label class="form-label" for="admin-pin">Enter Security PIN</label>
        <input class="form-input" type="password" id="admin-pin" placeholder="Enter 4-digit PIN" maxlength="4">
      </div>
      
      <button class="btn btn-primary" onclick="verifyAdminAuth()" style="width: 100%;">Verify & Open</button>
    </div>
  </div>

  <!-- Dashboard Container -->
  <div class="admin-container" id="admin-dashboard">
    
    <!-- Top Header -->
    <header>
      <div class="header-logo-group">
        <span class="header-logo">🛡️</span>
        <div class="header-title-wrapper">
          <h1>DE Mastery - Administration Portal</h1>
          <p>Real-time Neon PostgreSQL Database tracking cockpit</p>
        </div>
      </div>
      <button class="btn btn-danger" onclick="logoutAdmin()">🚪 Sign Out</button>
    </header>

    <!-- Main Workspace -->
    <div class="main-body">
      
      <!-- Left sidebar: Users Directory -->
      <div class="users-sidebar">
        <div class="sidebar-search-box">
          <input type="text" id="user-search" class="form-input" placeholder="🔍 Search users..." oninput="filterUsersList()">
        </div>
        <div class="sidebar-list-container" id="users-list">
          <!-- Rendered dynamically -->
        </div>
      </div>

      <!-- Right detail view -->
      <div class="details-panel" id="user-details-panel">
        <div class="no-selection">
          <div class="no-selection-icon">👥</div>
          <h3>No User Selected</h3>
          <p>Click on any user in the directory panel to view their complete progress profile.</p>
        </div>
      </div>

    </div>

  </div>

  <script>
    // Determine backend API endpoint URL (for local vs. remote GitHub Pages deployment)
    const hostname = window.location.hostname;
    const isLocal = hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '';
    
    let API_BASE_URL = localStorage.getItem('de_tracker_backend_url') || '';
    if (!API_BASE_URL) {
      API_BASE_URL = isLocal ? 'http://localhost:8000' : '';
    }
    if (API_BASE_URL.endsWith('/')) {
      API_BASE_URL = API_BASE_URL.slice(0, -1);
    }

    let users = [];
    let selectedUser = null;
    let selectedUserProgress = null;
    let activeTab = 'overview';
    let activeInspectDay = null;
    let activeInspectCategory = 'sql';
    let activeInspectQId = null;

    // Checks session authentication status on DOM load
    window.addEventListener('DOMContentLoaded', () => {
      const auth = sessionStorage.getItem('admin_authenticated');
      if (auth === 'true') {
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('admin-dashboard').style.display = 'flex';
        loadAdminUsersDirectory();
      }
    });

    // Validate PIN
    function verifyAdminAuth() {
      const pin = document.getElementById('admin-pin').value;
      if (pin === '6565') {
        sessionStorage.setItem('admin_authenticated', 'true');
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('admin-dashboard').style.display = 'flex';
        loadAdminUsersDirectory();
      } else {
        alert("❌ Access Denied: Invalid Security PIN.");
      }
    }

    function logoutAdmin() {
      sessionStorage.removeItem('admin_authenticated');
      document.getElementById('admin-pin').value = '';
      document.getElementById('auth-overlay').style.display = 'flex';
      document.getElementById('admin-dashboard').style.display = 'none';
    }

    // Load registered users list from database
    async function loadAdminUsersDirectory() {
      try {
        const response = await fetch(API_BASE_URL + '/api/admin/users');
        if (!response.ok) {
          throw new Error('Failed to load registered users directory');
        }
        const data = await response.json();
        users = data.users;
        filterUsersList();
      } catch (err) {
        console.error("Admin Directory Error:", err);
        alert("Failed to load users directory from Neon Cloud DB.");
      }
    }

    // Render users with search filter
    function filterUsersList() {
      const query = document.getElementById('user-search').value.toLowerCase();
      const container = document.getElementById('users-list');
      container.innerHTML = '';

      const filtered = users.filter(u => 
        u.name.toLowerCase().includes(query) || 
        u.email.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        container.innerHTML = '<div style="padding: 24px; text-align: center; color: var(--text-tertiary); font-size: 13px;">No users found.</div>';
        return;
      }

      filtered.forEach(u => {
        const item = document.createElement('div');
        const isActive = selectedUser && selectedUser.id === u.id;
        item.className = `user-list-item ${isActive ? 'active' : ''}`;
        item.onclick = () => selectUserAccount(u);

        const completionPct = Math.round((u.calendar_completed / 182) * 100);

        item.innerHTML = `
          <div class="user-meta-top">
            <div>
              <span class="user-name">${u.name}</span>
              <div class="user-email">${u.email}</div>
            </div>
            <button class="btn btn-danger" onclick="deleteUserAccount(event, ${u.id}, '${u.name}')" style="padding: 4px 8px; font-size: 10px; border-radius: 4px;">Delete</button>
          </div>
          <div class="user-stats-row">
            <span>🔥 ${u.current_streak} days</span>
            <span>💰 ${u.balance} rs</span>
            <span>Lvl ${u.level}</span>
          </div>
          <div style="font-size: 10px; color: var(--text-secondary); display:flex; justify-content:space-between; margin-top: 4px;">
            <span>Completed Days: ${u.calendar_completed}/182</span>
            <span>${completionPct}%</span>
          </div>
          <div class="user-progress-bar-wrapper">
            <div class="user-progress-bar-fill" style="width: ${completionPct}%"></div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    // Delete user account
    async function deleteUserAccount(e, userId, name) {
      e.stopPropagation(); // Avoid triggering list select

      if (!confirm(`⚠️ WARNING: Are you sure you want to completely delete the account and all progress of user "${name}"? This action is irreversible!`)) {
        return;
      }

      try {
        const res = await fetch(API_BASE_URL + `/api/admin/user/${userId}`, { method: 'DELETE' });
        if (!res.ok) {
          throw new Error('Failed to delete account from database');
        }
        
        alert("✅ User account and progress successfully deleted from PostgreSQL.");
        if (selectedUser && selectedUser.id === userId) {
          selectedUser = null;
          selectedUserProgress = null;
          document.getElementById('user-details-panel').innerHTML = `
            <div class="no-selection">
              <div class="no-selection-icon">👥</div>
              <h3>No User Selected</h3>
              <p>Click on any user in the directory panel to view their complete progress profile.</p>
            </div>
          `;
        }
        loadAdminUsersDirectory();
      } catch (err) {
        console.error("Delete user error:", err);
        alert("Failed to delete user account from Neon DB.");
      }
    }

    // Select a user to inspect
    async function selectUserAccount(user) {
      selectedUser = user;
      
      // Update directory selection highlight
      document.querySelectorAll('.user-list-item').forEach(item => item.classList.remove('active'));
      const activeItems = Array.from(document.querySelectorAll('.user-list-item'));
      const matched = activeItems.find(item => item.innerText.includes(user.email));
      if (matched) matched.classList.add('active');

      // Fetch user's complete detailed database payload
      try {
        const response = await fetch(API_BASE_URL + `/api/user/${user.id}/data`);
        if (!response.ok) {
          throw new Error('Failed to fetch detailed profile stats');
        }
        selectedUserProgress = await response.json();
        
        // Render detailed panel structure
        renderUserDashboardPanel();
      } catch (err) {
        console.error("Inspector Error:", err);
        alert("Failed to load user detailed logs from PostgreSQL.");
      }
    }

    // Render detailed workspace container
    function renderUserDashboardPanel() {
      const container = document.getElementById('user-details-panel');
      container.innerHTML = `
        <div class="details-header">
          <div class="details-user-title">${selectedUser.name}</div>
          <div class="details-user-subtitle">
            📧 ${selectedUser.email} | 🎯 Goal: ${selectedUser.goal || 'Not specified'} | 🕰️ Study Target: ${selectedUser.daily_study_hours || 5} hrs/day
          </div>
        </div>

        <div class="details-tabs">
          <button class="tab-btn ${activeTab === 'overview' ? 'active' : ''}" onclick="switchTab('overview')">Overview Status</button>
          <button class="tab-btn ${activeTab === 'calendar' ? 'active' : ''}" onclick="switchTab('calendar')">Calendar Tracker (182 Days)</button>
          <button class="tab-btn ${activeTab === 'workspace' ? 'active' : ''}" onclick="switchTab('workspace')">Code Workspace & AI Coach</button>
          <button class="tab-btn ${activeTab === 'projects' ? 'active' : ''}" onclick="switchTab('projects')">Portfolio Projects</button>
          <button class="tab-btn ${activeTab === 'cheatsheet' ? 'active' : ''}" onclick="switchTab('cheatsheet')">Cheat Sheets</button>
        </div>

        <div class="tab-contents">
          <!-- Overview Tab -->
          <div class="tab-pane ${activeTab === 'overview' ? 'active' : ''}" id="pane-overview">
            <div class="kpi-grid">
              <div class="kpi-card">
                <div class="kpi-title">Current Streak</div>
                <div class="kpi-value">🔥 ${selectedUserProgress.profile.current_streak || 0} Days</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-title">Best Streak</div>
                <div class="kpi-value">🏆 ${selectedUserProgress.profile.best_streak || 0} Days</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-title">Wallet Balance</div>
                <div class="kpi-value">💰 ${selectedUserProgress.profile.balance || 0} RS</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-title">Experience Points</div>
                <div class="kpi-value">💎 ${selectedUserProgress.profile.xp || 0} XP (Lvl ${selectedUserProgress.profile.level || 1})</div>
              </div>
            </div>

            <div class="kpi-grid" style="margin-top: 20px;">
              <div class="kpi-card">
                <div class="kpi-title">Calendar Completed</div>
                <div class="kpi-value">📆 ${selectedUserProgress.calendar.filter(d => d.completed).length} / 182</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-title">Questions Solved</div>
                <div class="kpi-value">🧑‍💻 ${selectedUserProgress.questions.filter(q => q.solved).length} Solves</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-title">Projects Complete</div>
                <div class="kpi-value">📁 ${selectedUserProgress.projects.filter(p => p.completed).length} Projects</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-title">Cheat Sheets Written</div>
                <div class="kpi-value">📝 ${selectedUserProgress.cheat_sheets.length} Sheets</div>
              </div>
            </div>

            <!-- Target Companies & Items -->
            <div style="background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius:12px; padding: 24px; margin-top:20px;">
              <h4 style="margin-bottom: 12px; font-weight:700;">Target Companies</h4>
              <div style="display:flex; gap: 8px; flex-wrap:wrap;">
                ${selectedUserProgress.target_companies.length === 0 
                  ? '<span style="color: var(--text-tertiary); font-size:13px;">No companies added yet.</span>'
                  : selectedUserProgress.target_companies.map(c => `<span class="badge badge-gray" style="font-size:12px; padding: 6px 12px;">${c.name}</span>`).join('')
                }
              </div>
            </div>
          </div>

          <!-- Calendar Tab -->
          <div class="tab-pane ${activeTab === 'calendar' ? 'active' : ''}" id="pane-calendar">
            <h4 style="font-weight:700;">182-Day Calendar Grid</h4>
            <p style="font-size:13px; color: var(--text-secondary); margin-bottom: 16px;">
              Green cells represent completed days. Red represent penalized days. Amber represent in-progress days. Click a cell to inspect notes and study hours.
            </p>
            
            <div class="calendar-grid">
              ${renderCalendarCells()}
            </div>

            <div id="day-inspector-section" style="margin-top: 24px;">
              <!-- Selected day inspect rendered here -->
            </div>
          </div>

          <!-- Workspace Tab -->
          <div class="tab-pane ${activeTab === 'workspace' ? 'active' : ''}" id="pane-workspace">
            <div style="display: flex; gap: 16px; margin-bottom: 16px;">
              <select id="inspect-category-select" class="form-input" style="width: 200px;" onchange="changeInspectCategory()">
                <option value="sql" ${activeInspectCategory === 'sql' ? 'selected' : ''}>SQL Problems</option>
                <option value="dsa" ${activeInspectCategory === 'dsa' ? 'selected' : ''}>DSA Problems</option>
                <option value="pyspark" ${activeInspectCategory === 'pyspark' ? 'selected' : ''}>PySpark Questions</option>
                <option value="concepts" ${activeInspectCategory === 'concepts' ? 'selected' : ''}>Core DE Concepts</option>
                <option value="interview" ${activeInspectCategory === 'interview' ? 'selected' : ''}>Behavioral / System Prep</option>
              </select>
            </div>
            
            <div class="workspace-split">
              <!-- Left side: Questions List -->
              <div class="workspace-list" id="workspace-questions-list">
                <!-- Rendered dynamically -->
              </div>
              
              <!-- Right side: Solution code, Notes and AI Coach log -->
              <div class="workspace-viewer" id="workspace-detail-viewer">
                <div style="padding: 40px; text-align: center; color: var(--text-tertiary); display:flex; flex-direction:column; justify-content:center; height:100%;">
                  <span style="font-size:48px;">💻</span>
                  <h4 style="margin-top:12px;">No Question Selected</h4>
                  <p style="font-size:13px; margin-top:4px;">Select an item from the questions bank list to view the student's solution, notes, and AI Coach history.</p>
                </div>
              </div>
            </div>
          </div>

          <!-- Projects Tab -->
          <div class="tab-pane ${activeTab === 'projects' ? 'active' : ''}" id="pane-projects">
            <h4 style="font-weight:700; margin-bottom: 16px;">Portfolio Projects Status</h4>
            <div style="display:flex; flex-direction:column; gap:16px;">
              ${renderProjectsList()}
            </div>
          </div>

          <!-- Cheat Sheet Tab -->
          <div class="tab-pane ${activeTab === 'cheatsheet' ? 'active' : ''}" id="pane-cheatsheet">
            <div style="display:flex; gap:16px; margin-bottom:16px;">
              <select id="cheatsheet-select" class="form-input" style="width: 250px;" onchange="renderCheatSheetDetail()">
                ${renderCheatSheetDropdownOptions()}
              </select>
            </div>
            <div class="cs-content-box" id="cheatsheet-viewer-content">
              Select a custom cheatsheet template to view.
            </div>
          </div>
        </div>
      `;

      if (activeTab === 'calendar') {
        if (activeInspectDay) {
          inspectCalendarDay(activeInspectDay);
        }
      } else if (activeTab === 'workspace') {
        renderWorkspaceQuestionsList();
      } else if (activeTab === 'cheatsheet') {
        renderCheatSheetDetail();
      }
    }

    function switchTab(tabId) {
      activeTab = tabId;
      renderUserDashboardPanel();
    }

    // --- CALENDAR TRACKER LOGIC ---
    function renderCalendarCells() {
      let cellsHTML = '';
      for (let i = 1; i <= 182; i++) {
        const row = selectedUserProgress.calendar.find(d => d.day_number === i);
        let status = 'not-started';
        if (row) {
          if (row.completed) status = 'completed';
          else if (row.penalized) status = 'penalized';
          else if (row.morning_completed || row.afternoon_completed || row.evening_completed) status = 'in-progress';
        }
        
        cellsHTML += `
          <div class="calendar-cell ${status}" onclick="inspectCalendarDay(${i})">
            D${i}
          </div>
        `;
      }
      return cellsHTML;
    }

    function inspectCalendarDay(dayNumber) {
      activeInspectDay = dayNumber;
      
      const container = document.getElementById('day-inspector-section');
      if (!container) return;

      const row = selectedUserProgress.calendar.find(d => d.day_number === dayNumber);
      
      let completedText = '❌ Not Completed';
      let studyTime = '0 minutes';
      let notes = 'No notes written for this day.';
      let rating = 'Not rated';
      let penalty = 'No penalties applied';
      let morning = '🔴 Incomplete';
      let afternoon = '🔴 Incomplete';
      let evening = '🔴 Incomplete';

      if (row) {
        if (row.completed) completedText = '✅ Completed';
        if (row.penalized) {
          completedText = '❌ Penalized';
          penalty = '⚠️ Missed tasks, -50 RS penalized';
        }
        studyTime = `${row.time_spent_minutes || 0} minutes`;
        if (row.notes) notes = row.notes;
        if (row.rating) rating = `${'⭐'.repeat(row.rating)} (${row.rating}/5)`;
        if (row.morning_completed) morning = '🟢 Completed';
        if (row.afternoon_completed) afternoon = '🟢 Completed';
        if (row.evening_completed) evening = '🟢 Completed';
      }

      container.innerHTML = `
        <div class="day-inspect-box">
          <div class="inspect-title">Day ${dayNumber} Inspection Overview</div>
          <div class="inspect-fields">
            <div class="inspect-field">
              <span class="inspect-label">Overall Completion Status</span>
              <span class="inspect-value" style="font-weight: 700;">${completedText}</span>
            </div>
            <div class="inspect-field">
              <span class="inspect-label">Study Duration</span>
              <span class="inspect-value">${studyTime}</span>
            </div>
            <div class="inspect-field">
              <span class="inspect-label">Morning Task Status</span>
              <span class="inspect-value">${morning}</span>
            </div>
            <div class="inspect-field">
              <span class="inspect-label">Afternoon Task Status</span>
              <span class="inspect-value">${afternoon}</span>
            </div>
            <div class="inspect-field">
              <span class="inspect-label">Evening Task Status</span>
              <span class="inspect-value">${evening}</span>
            </div>
            <div class="inspect-field">
              <span class="inspect-label">User Daily Rating</span>
              <span class="inspect-value">${rating}</span>
            </div>
            <div class="inspect-field" style="grid-column: span 2;">
              <span class="inspect-label">Penalization Log</span>
              <span class="inspect-value">${penalty}</span>
            </div>
            <div class="inspect-field" style="grid-column: span 2; margin-top: 8px;">
              <span class="inspect-label">User Notes / Reflections</span>
              <div style="background-color: var(--bg-primary); padding:12px; border-radius:6px; border:1px solid var(--border-color); font-size:13px; color: var(--text-secondary); white-space:pre-wrap;">${notes}</div>
            </div>
          </div>
        </div>
      `;
    }

    // --- WORKSPACE & CODING INSIGHTS ---
    function changeInspectCategory() {
      activeInspectCategory = document.getElementById('inspect-category-select').value;
      activeInspectQId = null;
      renderWorkspaceQuestionsList();
      document.getElementById('workspace-detail-viewer').innerHTML = `
        <div style="padding: 40px; text-align: center; color: var(--text-tertiary); display:flex; flex-direction:column; justify-content:center; height:100%;">
          <span style="font-size:48px;">💻</span>
          <h4 style="margin-top:12px;">No Question Selected</h4>
          <p style="font-size:13px; margin-top:4px;">Select an item from the questions bank list to view the student's solution, notes, and AI Coach history.</p>
        </div>
      `;
    }

    function renderWorkspaceQuestionsList() {
      const container = document.getElementById('workspace-questions-list');
      if (!container) return;
      container.innerHTML = '';

      const userQuestions = selectedUserProgress.questions.filter(q => q.category === activeInspectCategory);

      if (userQuestions.length === 0) {
        container.innerHTML = '<div style="padding:16px; text-align:center; color: var(--text-tertiary); font-size:12px;">No questions attempted in this category.</div>';
        return;
      }

      userQuestions.forEach(uq => {
        const item = document.createElement('div');
        const isActive = activeInspectQId === uq.item_id;
        item.className = `q-list-item ${isActive ? 'active' : ''}`;
        item.onclick = () => inspectQuestionSolve(uq);

        const qTitle = uq.title || `Question #${uq.item_id}`;

        item.innerHTML = `
          <span>${uq.solved ? '✅' : '⏳'} ${qTitle}</span>
          <span style="font-size: 10px; color: var(--text-tertiary);">${uq.attempts || 0} att.</span>
        `;
        container.appendChild(item);
      });
    }

    function inspectQuestionSolve(userQuestion) {
      activeInspectQId = userQuestion.item_id;
      
      document.querySelectorAll('.q-list-item').forEach(item => item.classList.remove('active'));
      const activeItems = Array.from(document.querySelectorAll('.q-list-item'));
      const matched = activeItems.find(item => item.innerText.includes(userQuestion.title || `Question #${userQuestion.item_id}`));
      if (matched) matched.classList.add('active');

      const viewer = document.getElementById('workspace-detail-viewer');
      if (!viewer) return;

      const codeSolution = userQuestion.solution_code || '-- No code submitted --';
      const notes = userQuestion.notes || 'No notes written for this question.';
      const confidence = userQuestion.confidence_level ? `${userQuestion.confidence_level} / 5` : 'Not rated';
      
      let chatHTML = '<div style="font-size:12px; color: var(--text-tertiary); text-align:center;">No AI Coach interactions recorded for this question.</div>';
      if (userQuestion.ai_chat_history && userQuestion.ai_chat_history.length > 0) {
        chatHTML = userQuestion.ai_chat_history.map(msg => `
          <div class="chat-bubble ${msg.role === 'user' ? 'user' : 'coach'}">
            <strong>${msg.role === 'user' ? 'Student' : 'AI Coach'}:</strong><br>
            ${msg.text.replace(/\n/g, '<br>')}
          </div>
        `).join('');
      }

      viewer.innerHTML = `
        <div class="workspace-viewer-header">
          <span style="font-weight:700; font-size:14px;">${userQuestion.title || 'Question Inspector'}</span>
          <div style="font-size:12px; color:var(--text-secondary);">
            Attempts: <strong>${userQuestion.attempts || 0}</strong> | Confidence: <strong>${confidence}</strong>
          </div>
        </div>
        <div class="workspace-viewer-body">
          <div>
            <div class="inspect-label" style="margin-bottom: 6px;">Code Workspace Submission</div>
            <div class="code-editor-mock">${escapeHTML(codeSolution)}</div>
          </div>

          <div>
            <div class="inspect-label" style="margin-bottom: 6px;">Student Notes & Doubts</div>
            <div style="background-color:var(--bg-primary); padding:12px; border-radius:6px; border:1px solid var(--border-color); font-size:13px; color:var(--text-secondary); white-space:pre-wrap;">${notes}</div>
          </div>

          <div>
            <div class="inspect-label" style="margin-bottom: 6px;">AI Coach Interactions Logs</div>
            <div class="chat-log-box">
              ${chatHTML}
            </div>
          </div>
        </div>
      `;
    }

    function escapeHTML(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // --- PORTFOLIO PROJECTS ---
    function renderProjectsList() {
      if (selectedUserProgress.projects.length === 0) {
        return '<div style="padding:24px; text-align:center; color: var(--text-tertiary); font-size:13px; background-color: var(--bg-card); border-radius:12px; border:1px solid var(--border-color);">No projects tracked yet.</div>';
      }

      return selectedUserProgress.projects.map(p => {
        const ghLink = p.github_url ? `<a href="${p.github_url}" target="_blank" style="color:var(--accent-teal); font-weight:600; text-decoration:none;">🔗 GitHub Repository</a>` : '<span style="color:var(--text-tertiary);">No repository link uploaded</span>';
        const projectNotes = p.notes || 'No project planning notes recorded.';
        const stars = p.rating ? '⭐'.repeat(p.rating) : 'Unrated';
        
        return `
          <div style="background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:12px; box-shadow: var(--shadow-sm);">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <span style="font-weight:700; font-size:16px;">${p.project_name}</span>
                <span class="badge ${p.completed ? 'badge-success' : 'badge-gray'}" style="margin-left: 10px;">${p.completed ? 'Completed' : 'In Progress'}</span>
              </div>
              <span style="font-size:12px; color: var(--text-secondary); font-weight:500;">Week: ${p.project_week}</span>
            </div>
            
            <div class="inspect-fields" style="margin-top:4px;">
              <div class="inspect-field">
                <span class="inspect-label">GitHub Repository</span>
                <span class="inspect-value">${ghLink}</span>
              </div>
              <div class="inspect-field">
                <span class="inspect-label">Duration / Rating</span>
                <span class="inspect-value">${p.time_spent_hours || 0} Hours | ${stars}</span>
              </div>
              <div class="inspect-field" style="grid-column: span 2;">
                <span class="inspect-label">Project Notes & Milestones</span>
                <div style="background-color: var(--bg-primary); padding:12px; border-radius:6px; border:1px solid var(--border-color); font-size:13px; color: var(--text-secondary); white-space:pre-wrap;">${projectNotes}</div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // --- CHEAT SHEET INSPECTION ---
    function renderCheatSheetDropdownOptions() {
      if (selectedUserProgress.cheat_sheets.length === 0) {
        return '<option value="">-- No Cheat Sheets Created --</option>';
      }

      return selectedUserProgress.cheat_sheets.map(cs => `
        <option value="${cs.sheet_key}">${cs.sheet_key.replace('_', ' ').toUpperCase()}</option>
      `).join('');
    }

    function renderCheatSheetDetail() {
      const select = document.getElementById('cheatsheet-select');
      const viewer = document.getElementById('cheatsheet-viewer-content');
      if (!select || !viewer) return;

      const key = select.value;
      if (!key) {
        viewer.innerText = 'No cheat sheets written.';
        return;
      }

      const sheet = selectedUserProgress.cheat_sheets.find(s => s.sheet_key === key);
      if (sheet) {
        viewer.innerText = sheet.content || '-- Empty Sheet --';
      } else {
        viewer.innerText = 'Unable to load cheat sheet content.';
      }
    }
  </script>

</body>
</html>
